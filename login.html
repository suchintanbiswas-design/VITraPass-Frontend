<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITraPass - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">VITra<span class="accent">Pass</span></h1>
            <p class="tagline">VIT Smart Event Ticketing System</p>
            <nav class="nav">
                <a href="index.html" class="nav-link" style="font-size: 0.9em;">&larr; Back to VITraPass Portal</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h2>Student Login</h2>
            <p class="subtitle">Access your VITraPass dashboard</p>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Loading..." required>
                    <span class="error-msg" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <span class="error-msg" id="password-error"></span>
                </div>

                <button type="submit" class="btn btn-primary" id="login-btn">
                    Login
                </button>
            </form>
            
            <div style="margin-top: 15px; text-align: center;">
                <a href="#" id="forgot-password-link" style="color: var(--primary-color);">Forgot Password?</a>
            </div>
            
            <div style="margin-top: 15px; text-align: center;">
                Don't have an account? <a href="signup.html" style="color: var(--primary-color);">Create one here</a>
            </div>


            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Authenticating...</p>
            </div>

            <div id="error-message" class="error-box hidden">
                <h3>✕ Login Failed</h3>
                <p id="error-detail"></p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2027 VITraPass — VIT Smart Event Ticketing System</p>
            <p class="footer-note">Cloud Architecture Design Project</p>
        </div>
    </footer>

    <!-- Amazon Cognito SDK -->
    <script src="https://unpkg.com/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check if already authenticated
            if (Auth.isAuthenticated()) {
                if (Auth.isStudent()) {
                    window.location.href = 'dashboard.html';
                } else {
                    Auth.signOut();
                    alert('Access Denied: You are not registered as a student.');
                    window.location.href = 'login.html';
                }
                return;
            }

            document.getElementById('email').placeholder = `your.email@${CONFIG.ALLOWED_EMAIL_DOMAIN}`;

            const loginForm = document.getElementById('login-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loading = document.getElementById('loading');
            const errorBox = document.getElementById('error-message');
            const errorDetail = document.getElementById('error-detail');

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                errorBox.classList.add('hidden');
                loading.classList.remove('hidden');

                const email = emailInput.value.trim().toLowerCase();
                const password = passwordInput.value;

                Auth.signIn(email, password, {
                    onSuccess: function (result) {
                        if (Auth.isStudent()) {
                            window.location.href = 'dashboard.html';
                        } else {
                            Auth.signOut();
                            loading.classList.add('hidden');
                            errorDetail.textContent = 'Access Denied: You are not registered as a student.';
                            errorBox.classList.remove('hidden');
                        }
                    },
                    onFailure: function (err) {
                        loading.classList.add('hidden');
                        errorDetail.textContent = err.message || JSON.stringify(err);
                        errorBox.classList.remove('hidden');
                    }
                });
            });

            document.getElementById('forgot-password-link').addEventListener('click', (e) => {
                e.preventDefault();
                const email = prompt("Enter your registered email address:");
                if (email) {
                    Auth.forgotPassword(email.trim().toLowerCase(), {
                        onSuccess: function() {
                            alert("Password reset completed.");
                        },
                        onFailure: function(err) {
                            alert("Error: " + err.message);
                        },
                        inputVerificationCode: function(data) {
                            const code = prompt("Enter the verification code sent to your email:");
                            const newPassword = prompt("Enter your new password:");
                            if (code && newPassword) {
                                Auth.confirmPassword(email.trim().toLowerCase(), code, newPassword, {
                                    onSuccess: function() {
                                        alert("Password successfully reset! You can now login.");
                                    },
                                    onFailure: function(err) {
                                        alert("Error confirming password: " + err.message);
                                    }
                                });
                            }
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
